<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLSC PCCOE — The Event Journey</title>
  <meta name="description" content="Meet the MLSC PCCOE mascot and step into the roadmap of every chapter event, from inauguration to the Bluebit Hackathon." />
  <meta name="author" content="MLSC PCCOE" />
  <meta property="og:title" content="MLSC PCCOE — The Event Journey" />
  <meta property="og:description" content="Step into the roadmap of every MLSC PCCOE event." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="landing" data-landing>
    <div class="landing-glow grain" data-landing-glow aria-hidden="true"></div>

    <section class="landing-hero">
      <div class="mascot-frame">
        <div class="halo animate-halo" aria-hidden="true"></div>
        <div class="animate-drop-in">
          <div class="mascot-glass glass">
            <img
              src="assets/images/mascot-wave.png"
              alt="MLSC PCCOE dragon mascot waving"
              width="1024"
              height="1024"
              class="mascot-img animate-float-soft"
            />
          </div>
          <div class="sparkles" data-sparkles aria-hidden="true"></div>
        </div>
      </div>

      <p class="mono-label landing-kicker">Microsoft Learn Student Chapter · PCCOE</p>

      <h1 class="landing-title" data-typewriter data-text="Hi, I'm your guide." data-delay="900" data-speed="55"></h1>

      <p class="landing-copy">
        Follow me along the path and every event we have lived through will
        unfold, one milestone at a time.
      </p>

      <a href="events.html" class="cta-pill glass" data-landing-cta>
        Enter the roadmap
        <span aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
